name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: tests/unit

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/unit/package-lock.json

      - name: Install unit test dependencies
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --ci

      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: tests/unit/coverage
          if-no-files-found: ignore

  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    defaults:
      run:
        working-directory: tests/e2e

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json

      - name: Install e2e dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Build and start Docker stack
        run: docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" up -d --build

      - name: Install and configure Nextcloud
        working-directory: .
        run: |
          docker exec --user www-data -w /var/www/html nextcloud-main php occ maintenance:install \
            --database "mysql" \
            --database-name "nextcloud" \
            --database-user "nextcloud" \
            --database-pass "nextcloudpass" \
            --database-host "db" \
            --admin-user "admin" \
            --admin-pass "admin" || true
          docker exec --user www-data nextcloud-main php occ config:system:set trusted_domains 1 --value=localhost
          docker exec --user www-data nextcloud-main php occ config:system:set overwriteprotocol --value="https"
          docker exec --user www-data nextcloud-main php occ config:system:set overwritehost --value="localhost"

      - name: Wait for draw.io and Nextcloud
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:5500 >/dev/null && \
              curl -kfsS https://localhost/status.php | grep -q '"installed":true'; then
              echo "Services are ready"
              exit 0
            fi
            echo "Waiting for services to become ready... ($i/60)"
            sleep 5
          done
          echo "Services did not become ready in time"
          docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" ps
          exit 1

      - name: Run Playwright tests
        env:
          DRAWIO_URL: http://localhost:5500
          NEXTCLOUD_URL: https://localhost
          NEXTCLOUD_USER: admin
          NEXTCLOUD_PASS: admin
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore

      - name: Dump Docker logs on failure
        if: failure()
        run: docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" logs --no-color

      - name: Stop Docker stack
        if: always()
        run: docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" down -v
