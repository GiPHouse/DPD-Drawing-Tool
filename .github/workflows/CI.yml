name: CI
on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit-tests:
    name: Unit tests (Jest)
    if: github.event.pull_request.draft == false || github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 1
    defaults:
      run:
        working-directory: tests/unit
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/unit/package-lock.json
      - name: Install unit test dependencies
        run: npm ci
      - name: Run Jest tests
        run: npm test -- --ci
      - name: Upload unit coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: tests/unit/coverage
          if-no-files-found: ignore
  e2e-tests:
    name: E2E tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 1
    if: github.event_name == 'pull_request' && github.event.pull_request.draft == false
    defaults:
      run:
        working-directory: tests/e2e
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - name: Install e2e dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Generate and start integration stack
        working-directory: .
        run: |
          chmod +x ./start.sh
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          ./start.sh
      - name: Wait for draw.io and Nextcloud
        run: |
          for i in {1..60}; do
            if curl -kfsS https://localhost:5443 >/dev/null && \
              curl -kfsS https://localhost/status.php | grep -q '"installed":true'; then
              echo "Services are ready"
              exit 0
            fi
            echo "Waiting for services to become ready... ($i/60)"
            sleep 5
          done
          echo "Services did not become ready in time"
          if [ -f "$GITHUB_WORKSPACE/docker-compose.yml" ]; then
            docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" ps
          fi
          exit 1
      - name: Run Playwright tests
        run: npm test
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report
          if-no-files-found: ignore
      - name: Dump Docker logs on failure
        if: failure()
        run: |
          if [ -f "$GITHUB_WORKSPACE/docker-compose.yml" ]; then
            docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" logs --no-color
          fi
      - name: Stop Docker stack
        if: always()
        run: |
          if [ -f "$GITHUB_WORKSPACE/docker-compose.yml" ]; then
            docker compose -f "$GITHUB_WORKSPACE/docker-compose.yml" logs --no-color
          fi
