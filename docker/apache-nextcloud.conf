# ====== NOLAI - Infrastructure / Sprint 2 / Task: Apache Nextcloud VHost ======
#
# Apache2 virtual host configuration for the Nextcloud application.
# Copied into the image by docker/Dockerfile and enabled via a2ensite.
#
# WHY port 8000 (not 80):
#   Caddy owns ports 80 and 443 for TLS termination. Apache is configured to
#   listen on the internal port 8000 so there is no port conflict. Caddy
#   reverse-proxies 443 → 127.0.0.1:8000 for all Nextcloud traffic.
#
# WHY AllowOverride All:
#   Nextcloud ships its own .htaccess files to configure URL rewriting
#   (pretty permalinks) and security headers. AllowOverride All is required
#   for Apache to process those files.
#
# WHY mod_rewrite + mod_headers:
#   mod_rewrite: Nextcloud's .htaccess uses RewriteRule for clean URLs.
#   mod_headers: Nextcloud uses Header directives for security headers.
#   Both modules are enabled in docker/Dockerfile via a2enmod.
#
# ====== end of changes by SE ======

<VirtualHost *:8000>
    ServerName localhost
    DocumentRoot /var/www/nextcloud

    <Directory /var/www/nextcloud>
        Require all granted
        AllowOverride All
        Options FollowSymLinks MultiViews

        # Disable Apache's built-in WebDAV module. Nextcloud provides its own
        # WebDAV implementation. The two conflict if both are active.
        <IfModule mod_dav.c>
            Dav off
        </IfModule>
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/nextcloud_error.log
    CustomLog ${APACHE_LOG_DIR}/nextcloud_access.log combined
</VirtualHost>
