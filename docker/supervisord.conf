# ====== NOLAI - Infrastructure / Sprint 2 / Task: Supervisord Config ======
#
# Process supervisor configuration for the single-container image.
#
# WHAT IS SUPERVISORD:
#   supervisord is a process manager. Docker normally runs one process per
#   container; supervisord acts as that single process (PID 1) and is
#   responsible for starting and keeping alive all other services inside the
#   container. If any managed process crashes, supervisord restarts it.
#
# WHY nodaemon=true:
#   By default supervisord forks into the background and detaches. In a Docker
#   container, if PID 1 exits the container stops. nodaemon=true keeps
#   supervisord in the foreground as PID 1 so Docker sees an active process.
#
# SERVICE STARTUP ORDER:
#   MariaDB and Caddy are started immediately. Apache and Tomcat are also
#   started immediately, but Apache depends on the Nextcloud files being in
#   place (handled by entrypoint.sh before supervisord is ever launched).
#   All four start in parallel — there is no sequential dependency enforced
#   here because entrypoint.sh guarantees everything is ready before handing
#   off to supervisord.
#
# ====== end of changes by SE ======

[supervisord]
; Run in the foreground so Docker treats supervisord as the active process
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor

; -----------------------------------------------------------------------
; MariaDB — Nextcloud's database server
;
; WHY --datadir=/data/mysql: the /data volume is the persistent mount point.
; Storing the data directory there means database state survives container
; restarts and image upgrades.
;
; WHY user=root with mysqld_safe: mysqld_safe is a wrapper that drops
; privileges to the 'mysql' user internally. Running as root here lets
; supervisord own the process and see its exit code correctly.
; -----------------------------------------------------------------------
[program:mariadb]
command=/usr/bin/mysqld_safe --datadir=/data/mysql --user=mysql
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/mariadb.log
stderr_logfile=/var/log/supervisor/mariadb.err.log
user=root

; -----------------------------------------------------------------------
; Apache2 — PHP application server for Nextcloud
;
; WHY -D FOREGROUND: apache2ctl normally daemonises Apache. The FOREGROUND
; flag keeps it attached to the terminal so supervisord can monitor it and
; know when it exits.
;
; Apache is configured to listen on internal port 8000 (see apache-nextcloud.conf
; and the sed command in the Dockerfile). Caddy reverse-proxies 443 → 8000.
; -----------------------------------------------------------------------
[program:apache2]
command=/usr/sbin/apache2ctl -D FOREGROUND
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/apache2.log
stderr_logfile=/var/log/supervisor/apache2.err.log

; -----------------------------------------------------------------------
; Tomcat 9 — Java application server for Draw.io
;
; WHY JAVA_HOME and CATALINA_HOME: catalina.sh requires both environment
; variables to locate the JRE and Tomcat installation. The /opt/java symlink
; is created in the Dockerfile to provide a platform-independent JAVA_HOME.
;
; Tomcat serves the Draw.io WAR on internal port 8080. Caddy reverse-proxies
; 5443 → 8080.
; -----------------------------------------------------------------------
[program:tomcat]
command=/opt/tomcat/bin/catalina.sh run
autostart=true
autorestart=true
environment=JAVA_HOME="/opt/java",CATALINA_HOME="/opt/tomcat",CATALINA_BASE="/opt/tomcat"
stdout_logfile=/var/log/supervisor/tomcat.log
stderr_logfile=/var/log/supervisor/tomcat.err.log

; -----------------------------------------------------------------------
; Caddy — reverse proxy and HTTPS termination
;
; Caddy handles TLS for both services:
;   Port 443  → Apache2:8000 (Nextcloud)
;   Port 5443 → Tomcat:8080  (Draw.io)
;
; For local/testing deployments it uses local_certs (self-signed CA).
; For production deployments with a real domain it auto-obtains a
; Let's Encrypt certificate (remove local_certs from docker/Caddyfile).
; -----------------------------------------------------------------------
[program:caddy]
command=/usr/bin/caddy run --config /etc/caddy/Caddyfile --adapter caddyfile
autostart=true
autorestart=true
stdout_logfile=/var/log/supervisor/caddy.log
stderr_logfile=/var/log/supervisor/caddy.err.log
